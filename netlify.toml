[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# SPA: rutas de React Router (/documentales, /publicaciones, etc.)
# deben servir index.html en lugar de devolver 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
